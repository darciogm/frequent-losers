site_name: "Frequent Losers as Cover Bidders"
site_url: https://darciogm.github.io/research/frequent-losers/
site_description: "Frequent Losers as Cover Bidders in Public Procurement — Genicolo-Martins & Furquim de Azevedo (Insper)"
site_author: "Darcio Genicolo-Martins & Paulo Furquim de Azevedo"

theme:
  name: material
  font: false
  palette:
    - scheme: default
      accent: red
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      accent: red
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/file-document-outline

nav:
  - Home: index.md
  - Autores: autores.md
  - Paper:
    - Manuscript: paper.md
    - Mind Map: mindmap.md
    - Changelog: changelog.md
  - Results:
    - Main Results: results.md
    - Robustness: robustness.md
    - Extensions: extensions.md
  - Replication: replication.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: "100%"
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - assets/extra.css
