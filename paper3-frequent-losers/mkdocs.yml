site_name: "Cheap Signals, Costly Proof"
site_url: https://darciogm.github.io/research/frequent-losers/
site_description: "Cheap Signals, Costly Proof: Award-Layer Evidence Triage in Cartel Enforcement — Genicolo-Martins & Furquim de Azevedo (Insper)"
site_author: "Darcio Genicolo-Martins & Paulo Furquim de Azevedo"

theme:
  name: material
  font: false
  palette:
    - scheme: default
      accent: red
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      accent: red
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/file-document-outline

nav:
  - Home: index.md
  - Video: video.md
  - Autores: autores.md
  - Paper:
    - Manuscript: paper.md
    - Mind Map: mindmap.md
    - Changelog: changelog.md
  - Hypotheses:
    - Overview: hypotheses/index.md
    - "H1 — FL score concentrates CADE cobidders": hypotheses/cobidder-concentration.md
    - "H2 — FL score is null on direct CADE defendants": hypotheses/direct-defendants-null.md
    - "H3 — Concentration survives exposure discipline": hypotheses/exposure-discipline.md
    - "H4 — Concentration survives timing discipline": hypotheses/timing-discipline.md
    - "H5 — FL cobidders are economically distinct": hypotheses/cobidder-profile-distinct.md
    - "H6 — Award and bid layers are complementary": hypotheses/award-bid-complementarity.md
    - "H7 — Gatekeeping cuts forensic pool cost-effectively": hypotheses/gatekeeping-cost-of-evidence.md
    - "H8 — Price evidence carries scope, not damages": hypotheses/price-scope-sign-reversal.md
  - Analyses:
    - Overview: analyses/index.md
  - Findings:
    - Overview: findings/index.md
    - "Cobidders concentrate in FL stratum": findings/cobidders-concentrated-in-fl-stratum.md
    - "Direct defendants show null discrimination": findings/direct-defendants-null-result.md
    - "Concentration survives audits": findings/concentration-survives-audits.md
    - "FL cobidders are operationally distinct": findings/cobidders-operationally-distinct.md
    - "Gatekeeping cuts bid-microdata pool 83%": findings/gatekeeping-cuts-pool-83pct.md
    - "Joint scoring is the full-observability upper bound": findings/full-observability-upper-bound.md
    - "Price sign reverses — scope, not damages": findings/price-sign-reversal-scope.md
  - Results:
    - Main Results: results.md
    - Robustness: robustness.md
    - Extensions: extensions.md
    - Advanced Methods: advanced.md
  - Replication: replication.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: "100%"
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - assets/extra.css
