site_name: "The Price of Exclusion: SME Set-Asides in Public Procurement"
site_url: https://darciogm.github.io/research/sme-public/
site_description: "The Price of Exclusion: SME Set-Asides in Public Procurement — Genicolo-Martins (Insper)"
site_author: "Darcio Genicolo-Martins"

theme:
  name: material
  font: false
  palette:
    - scheme: default
      accent: red
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      accent: red
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/file-document-outline

nav:
  - Home: index.md
  - Papers: papers.md
  - Video: video.md
  - Autores: autores.md
  - Paper:
    - Manuscript: paper.md
    - Mind Map: mindmap.md
    - Changelog: changelog.md
  - Hypotheses:
    - Overview: hypotheses/index.md
    - "H1 — Open auctions lower prices": hypotheses/price-discipline-loss.md
    - "H2 — Open auctions thicken the bidder pool": hypotheses/entry-thickens-pool.md
    - "H3 — Open auctions widen geographic catchment": hypotheses/distance-widens-under-open.md
    - "H4 — Open auctions lower SME winner share": hypotheses/sme-winner-share-falls.md
    - "H5 — Exclusion dominates the decomposition": hypotheses/exclusion-dominates.md
    - "H6 — Protected pool responds but cannot replace": hypotheses/protected-pool-responds.md
    - "H7 — Pregão drop-outs admit IPV-clock reading": hypotheses/ipv-clock-admissible.md
    - "H8 — Static welfare loss is large": hypotheses/static-welfare-loss-large.md
    - "H9 — Price preference is near-free": hypotheses/preference-near-zero-cost.md
    - "H10 — Implied SME welfare weight is large": hypotheses/implied-welfare-weight-large.md
    - "H11 — Parallel trends hold": hypotheses/parallel-trends-hold.md
    - "H12 — No collusion confound": hypotheses/no-collusion-confound.md
  - Analyses:
    - Overview: analyses/index.md
  - Findings:
    - Overview: findings/index.md
    - "Open auctions cut prices ~13%": findings/price-drop-open-vs-sme.md
    - "Entry rises 10-22% under open auctions": findings/entry-rises-with-competition.md
    - "Distant suppliers enter on high-value items": findings/distant-suppliers-enter.md
    - "Exclusion dominates the decomposition": findings/exclusion-dominates-decomposition.md
    - "Protected pool cannot replace lost discipline": findings/protected-pool-cannot-replace.md
    - "Static welfare loss ~28.9%": findings/static-welfare-loss-large.md
    - "10% price preference is near-free": findings/price-preference-near-free.md
    - "Pharma is a boundary case": findings/pharma-boundary-not-headline.md
  - Results:
    - Main Results: results.md
    - Robustness: robustness.md
    - Extensions: extensions.md
    - Advanced Methods: advanced.md
  - Replication: replication.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: "100%"
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - assets/extra.css
