site_name: "Bitter Pills"
site_url: https://darciogm.github.io/research/bitter-pills/
site_description: "Sourcing under Sanctions: Judicial Urgency and Pharmaceutical Procurement Costs — Genicolo-Martins & Furquim de Azevedo (Insper)"
site_author: "Darcio Genicolo-Martins & Paulo Furquim de Azevedo"

theme:
  name: material
  font: false
  palette:
    - scheme: default
      accent: red
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - scheme: slate
      accent: red
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/file-document-outline

nav:
  - Home: index.md
  - Papers: papers.md
  - Video: video.md
  - Autores: autores.md
  - Paper:
    - Manuscript: paper.md
    - Mind Map: mindmap.md
    - Changelog: changelog.md
  - Hypotheses:
    - Overview: hypotheses/index.md
    - "H1 — Urgent procurement is costlier and less competitive": hypotheses/urgent-costlier-less-competitive.md
    - "H2 — The under-the-gun gap is selection-bounded": hypotheses/utg-gap-selection-bounded.md
    - "H3 — No broad same-firm markup in deep markets": hypotheses/no-broad-same-firm-markup.md
    - "H4 — Supplier leverage reappears in thin markets": hypotheses/thin-market-supplier-leverage.md
    - "H5 — Court mandates give up scale": hypotheses/lost-scale.md
    - "H6 — Urgency reallocates the winning supplier set": hypotheses/supplier-set-reallocation.md
    - "H7 — Litigation-specific; dynamics are diagnostic": hypotheses/placebo-and-dynamics.md
  - Analyses:
    - Overview: analyses/index.md
  - Findings:
    - Overview: findings/index.md
    - "Legal urgency raises procurement costs": findings/urgency-raises-costs.md
    - "The under-the-gun gap is selection-bounded": findings/utg-gap-selection-bounded.md
    - "No broad same-firm markup in deep markets": findings/no-broad-same-firm-markup.md
    - "Supplier leverage reappears in thin markets": findings/thin-market-leverage.md
    - "Fragmented sourcing is the margin": findings/fragmented-sourcing-is-the-margin.md
    - "A judicial-enforcement form of passive waste": findings/judicial-enforcement-passive-waste.md
    - "Fiscal procurement-cost implication": findings/fiscal-procurement-cost.md
  - Results:
    - Main Results: results.md
    - Robustness: robustness.md
    - Extensions: extensions.md
    - Advanced Methods: advanced.md
  - Replication: replication.md

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      slide_effect: slide
      width: "100%"
      height: auto
      zoomable: true
      draggable: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.keys
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - footnotes
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/extra.css
  - assets/extra.css
