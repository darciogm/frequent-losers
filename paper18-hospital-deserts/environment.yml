name: paper18
channels:
  - conda-forge
dependencies:
  # ---- Python core ----
  - python=3.11
  - pip
  - duckdb
  - polars
  - pyarrow
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - psutil
  # ---- geospatial ----
  - geopandas
  - shapely
  - fiona
  - pyproj
  # ---- ML used in framework ----
  - gensim
  # ---- R and packages used by 24b/25/30/31/34/35 ----
  - r-base=4.4
  - r-arrow
  - r-data.table
  - r-fixest
  - r-did
  - r-grf
  - r-ggplot2
  - r-jsonlite
  - r-patchwork
  # ---- pip-only ----
  - pip:
      - pecanpy==2.0.9     # verified in local .venv on 2026-05-01
      # osmnx pin blocked offline in this workspace; see 04_logs/phaseB_install_summary.md
      - anthropic          # LLM classifier (R1 / 28 / 28d)
      - pyreaddbc          # DATASUS .dbc → parquet (raw ingest)
      - dbfread
